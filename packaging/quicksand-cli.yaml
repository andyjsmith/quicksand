# nFPM configuration for the qs command-line client package; built by
# scripts/build-packages.sh.
name: quicksand-cli
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: semver
section: utils
maintainer: Andy Smith <andy@ajsmith.org>
homepage: https://github.com/andyjsmith/quicksand
description: |-
  Quicksand command-line client (qs)
  Deploys and manages Quicksand sandbox VMs from a terminal: power,
  snapshots, shells, exec, file transfers and port forwarding.

contents:
  - src: dist/packaging/qs
    dst: /usr/bin/qs
    file_info:
      mode: 0755
  # Shell completion, from "qs completion <shell>".
  - src: dist/packaging/qs.bash
    dst: /usr/share/bash-completion/completions/qs
  - src: dist/packaging/qs.fish
    dst: /usr/share/fish/vendor_completions.d/qs.fish
  - src: dist/packaging/_qs
    dst: /usr/share/zsh/vendor-completions/_qs
    packager: deb
  - src: dist/packaging/_qs
    dst: /usr/share/zsh/site-functions/_qs
    packager: rpm
