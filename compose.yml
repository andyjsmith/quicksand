# Runs the Quicksand server from its published image. See docs/deploy.md.
#
# Put config.json (with "listen": ":8484"), the icons folder and any TLS certificate in ./config, readable by user ID
# 10001, then:
#
#   docker compose up -d
#   docker compose exec quicksand quicksand user add -admin <username>
services:
  quicksand:
    image: ghcr.io/andyjsmith/quicksand:latest
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - ./config:/etc/quicksand:ro
      - data:/var/lib/quicksand
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
